[pytest]

python_paths = ./
testpaths = ./tests

# Slow
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    
# Logging
log_file = pytest.log
log_file_level = WARNING
log_file_format = %(asctime)s %(levelname)s %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Environment
env =
    CI: true

# Option
addopts = -v --log-cli-level=WARNING
# --capture=no 